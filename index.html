        const shortSpecLabel = (label) => label.replace(/\s*\(.*\)/, '');

        // Aide au choix : style de tirage déduit de la résistance (valeurs indicatives)

        // Filtres et tri proposés aux clients
        const DEFAULT_FILTERS = { sort: '', brand: '', type: '', nic: '', vol: '', inStock: false };
        const minPrice = (p) => { const prices = p.variants.map(v => Number(v.price) || 0).filter(x => x > 0); return prices.length ? Math.min(...prices) : 0; };
        const variantMatches = (v, f) => (!f.nic || v.nicotine_level === f.nic) && (!f.vol || v.volume_ml === f.vol);
        const applyFilters = (list, f) => {
            let out = list.filter(p =>

        // ====================================================================

        // ====================================================================
        const SPEC_LABEL_MAP = {
            battery_mah: { battery: 'Capacité (mAh)', _: 'Batterie (mAh)' },
            power_w: { mod: 'Puissance maximale (W)', pod: 'Puissance (W)', atomizer: 'Puissance recommandée (W)', coil: 'Puissance recommandée (W)', _: 'Puissance (W)' },

        const specLabelFor = (key, type) => (SPEC_LABEL_MAP[key] && (SPEC_LABEL_MAP[key][type] || SPEC_LABEL_MAP[key]._)) || key;

        // Mots-clés (FR/EN) reconnus dans les lignes « Libellé : valeur »
        const SPEC_LINE_KEYS = [
            ['battery_mah', /batter|accu\b|mah/i],
            ['power_w', /puissance|power|wattage|output/i],
            ['ohm', /r[ée]sistance|resistance|ohm/i],
            ['capacity_ml', /capac|volume|tank|r[ée]servoir|e-?liquid/i],
            ['diameter_mm', /diam/i],

            ['draw', /draw|tirage|mtl|dtl|rdl/i],
            ['dimensions', /dimension|size|taille/i],
            ['weight', /weight|poids/i],
            ['material', /material|mat[ée]riau|mati[èe]re/i],
            ['puffs', /puff|bouff/i],
            ['screen', /screen|[ée]cran|display/i],
            ['airflow', /air ?flow|flux d.air/i],

        ];

        const detectProductType = (name, text) => {
            const hay = (n) => (String(name).match(n) || []).length * 3 + (String(text).match(n) || []).length;
            const scores = {
                disposable: hay(/disposable|jetable|puffs?\b|bouff[ée]es?/gi) * 2,
                pod: hay(/\bpods?\b/gi),
                mod: hay(/box ?mod|\bmod\b|dual 18650/gi) * 2,
                atomizer: hay(/atomi[sz]er|clearomi[sz]er|\btank\b|atomiseur/gi) * 1.5,
                coil: hay(/\bcoils?\b|r[ée]sistances? de remplacement|replacement coil/gi),
                battery: hay(/\baccus?\b|batterie|\bbattery\b|18650|20700|21700/gi) * 0.5,
                charger: hay(/chargeur|charger/gi) * 2,
                eliquid: hay(/e-?liquid|e-?liquide|\bPG\/VG|VG\/PG/gi),
                diy: hay(/ar[ôo]me|aroma|concentr|booster|shortfill|\bDIY\b/gi)
            };
            let best = '', bestScore = 0;
            Object.entries(scores).forEach(([t, sc]) => { if (sc > bestScore) { best = t; bestScore = sc; } });
            return best;
        };

        const extractSpecsFromText = (text, name, currentType) => {
            const type = currentType || detectProductType(name, text);
            const found = {};      // clé -> valeur
            const custom = [];     // lignes « Libellé : valeur » non reconnues
            const clean = (v) => String(v).replace(/\s+/g, ' ').trim();

            // 1) lignes « Libellé : valeur »
            text.split(/\r?\n/).forEach(line => {
                if (/https?:\/\//i.test(line)) return;
                const m = line.match(/^\s*[-•*]?\s*([^:：\t|]{2,40}?)\s*[:：\t|]\s*(.{1,80})$/);
                if (!m) return;
                const label = clean(m[1]), value = clean(m[2]);
                const hit = SPEC_LINE_KEYS.find(([, re]) => re.test(label));
                if (hit) { if (!found[hit[0]]) found[hit[0]] = value; }
                else if (label.length <= 32 && value.length <= 60 && !/^(package|in the box|contenu)/i.test(label)) custom.push({ label, value });
            });

            // 2) valeurs repérées dans le texte libre
            const grab = (key, re, fmt) => { if (found[key]) return; const m = text.match(re); if (m) found[key] = fmt(m); };
            const n = (x) => String(x).replace(',', '.');
            grab('battery_mah', /(\d[\d\s.,]{2,6})\s?mAh/i, m => clean(m[1]).replace(/[\s.,]/g, '') + ' mAh');
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?(?:-|–|to|à)\s?(\d{1,3}(?:[.,]\d+)?)\s?W\b/i, m => `${n(m[1])}-${n(m[2])} W`);
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?W\b/, m => `${n(m[1])} W`);
            grab('ohm', /(\d+(?:[.,]\d+)?)\s?(?:Ω|ohms?)(?![a-z])/i, m => `${n(m[1])} Ω`);
            grab('capacity_ml', /(\d+(?:[.,]\d+)?)\s?ml\b/i, m => `${n(m[1])} ml`);
            grab('diameter_mm', /(?:diam[eè]tre|diameter)\D{0,12}(\d{1,2}(?:[.,]\d+)?)\s?mm/i, m => `${n(m[1])} mm`);
            if (/PG|VG/.test(text)) grab('pgvg', /\b(\d{2})\s?\/\s?(\d{2})\b/, m => `${m[1]}/${m[2]}`);
            grab('format', /(\d)\s?[x×]\s?(18650|20700|21700)/i, m => `${m[1]} × ${m[2]}`);
            grab('format', /\b(18650|20700|21700)\b/, m => m[1]);
            grab('charge', /(type-?c|usb-?c|micro-?usb)/i, m => /micro/i.test(m[1]) ? 'Micro-USB' : 'USB-C');
            if (!found.draw) { const d = [...new Set((text.match(/\b(MTL|RDL|DTL|RDTL)\b/gi) || []).map(x => x.toUpperCase()))]; if (d.length) found.draw = d.join(' / '); }
            grab('dimensions', /(\d{1,3}(?:[.,]\d+)?)\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?)(?:\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?))?\s?mm/i, m => [m[1], m[2], m[3]].filter(Boolean).map(n).join(' × ') + ' mm');
            grab('weight', /(?:weight|poids)\D{0,10}(\d{1,4}(?:[.,]\d+)?)\s?(g|kg)\b/i, m => `${n(m[1])} ${m[2]}`);
            grab('puffs', /(\d{2,5})\s?(?:puffs?|bouff[ée]es?)/i, m => m[1]);
            if (type === 'disposable') grab('nic', /(\d{1,2}(?:[.,]\d+)?)\s?mg(?:\/ml)?/i, m => `${n(m[1])} mg/ml`);

            // 3) résultats ordonnés selon les champs du type
            const items = Object.entries(found).map(([key, value]) => ({ key: 'spec', label: specLabelFor(key, type), value, checked: true }));
            const order = (PRODUCT_TYPES[type]?.fields || []).map(f => f.label);
            items.sort((a, b) => { const ia = order.indexOf(a.label), ib = order.indexOf(b.label); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
            const seen = new Set(items.map(it => norm(it.label)));
            custom.slice(0, 8).forEach(c => { if (!seen.has(norm(c.label))) { seen.add(norm(c.label)); items.push({ key: 'spec', label: c.label, value: c.value, checked: true }); } });

            // 4) contenu de la boîte
            const bm = text.match(/(?:package (?:list|includes?|contents?)|in the box|what'?s included|contenu(?: de la bo[iî]te| du pack| du colis)?)\s*[:：-]?\s*([\s\S]{5,400})/i);
            if (bm) {
                const box = bm[1].split(/\n\s*\n/)[0].replace(/\s*\n\s*/g, '\n').trim().slice(0, 300);
                if (box.length >= 5) items.push({ key: 'box', label: 'Contenu de la boîte', value: box, checked: true });
            }
            return { type, items };
        };

        const DIY_VOLUMES = ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'];
        const DIY_NICOTINES = ['0mg', '3mg', '6mg'];

        // Tri stable des rubriques selon l'ordre d'affichage choisi par l'administrateur
        const sortCategories = (list) => list.slice().sort((a, b) => (a.display_order ?? 0) - (b.display_order ?? 0));

        const fetchAll = async (table) => {
            const pageSize = 1000;
            let from = 0;
            let all = [];
            while (true) {
                let data, error;
                if (table === 'categories') {
                    const res = await supabaseClient.from(table).select('*').order('display_order', { ascending: true }).order('id').range(from, from + pageSize - 1);
                    if (res.error) {
                        const fallbackRes = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                        if (fallbackRes.error) throw fallbackRes.error;
                        data = fallbackRes.data;
                    } else {
                        data = res.data;
                    }
                } else {
                    const res = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                    if (res.error) throw res.error;
                    data = res.data;
                }
                all = all.concat(data || []);
                if (!data || data.length < pageSize) break;

        const compressImage = (file, maxSize = 1200, quality = 0.82) => new Promise((resolve) => {
            if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return resolve(file);
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (!blob || blob.size >= file.size) return resolve(file);
                    resolve(blob);
                }, 'image/webp', quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });

        const uploadImageToSupabase = async (file) => {
            if (!file) return null;
            const body = await compressImage(file);
            const isOriginal = body === file;
            const ext = isOriginal ? (file.name.split('.').pop() || 'jpg') : (body.type === 'image/webp' ? 'webp' : 'png');
            const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${ext}`;

            const { error } = await supabaseClient.storage
                .from('esigara-media')
                .upload(filePath, body, { contentType: body.type || undefined, cacheControl: '31536000' });

            if (error) {
                alert("Erreur d'upload image : " + error.message);
                return null;
            }

            const { data: publicUrlData } = supabaseClient.storage.from('esigara-media').getPublicUrl(filePath);
            return publicUrlData.publicUrl;

        // ====================================================================
        // Composants
        // ====================================================================
        // Liste des rubriques classée en arbre : Rubrique > Sous-rubrique > Dossier
        const buildCategoryTree = (cats, excludeIds = []) => {
            const out = [];
            const byParent = {};
            cats.forEach(c => {
                const pid = c.parent_id && cats.some(x => x.id === c.parent_id) ? c.parent_id : '';
                (byParent[pid] = byParent[pid] || []).push(c);
            });
            const walk = (pid, depth, path, root, seen) => {
                (byParent[pid] || []).forEach(c => {
                    if (seen.has(c.id)) return;
                    const nextSeen = new Set(seen); nextSeen.add(c.id);
                    const full = path ? `${path} › ${c.name}` : c.name;
                    if (!excludeIds.includes(c.id)) out.push({ cat: c, depth, path: full, root: root || c });
                    walk(c.id, depth + 1, full, root || c, nextSeen);
                });
            };
            walk('', 0, '', null, new Set());
            return out;
        };

        // Options de sélection groupées par rubrique principale
        function CategoryOptions({ categories, excludeIds = [], suffix, fullPath }) {
            const tree = buildCategoryTree(categories, excludeIds);
            const groups = [];
            tree.forEach(n => {
                let g = groups.find(x => x.root.id === n.root.id);
                if (!g) { g = { root: n.root, items: [] }; groups.push(g); }
                g.items.push(n);
            });
            return groups.map(g => (
                <optgroup key={g.root.id} label={`📁 ${g.root.name}`}>
                    {g.items.map(n => (
                        <option key={n.cat.id} value={n.cat.id}>

                                ? n.path
                                : (n.depth === 0 ? `${n.cat.name} (rubrique entière)` : `${'\u00A0\u00A0'.repeat(n.depth - 1)}↳ ${n.cat.name}`)}

        function VariantSelector({ variants, currentId, onSelect, size = 'sm' }) {

        function ProductCard({ product, brand, hideOutOfStock, selectedVarId, onSelectVariant, qty, onQty, onOpen, onAdd }) {
            const availableVariants = hideOutOfStock ? product.variants.filter(isInStock) : product.variants;

        // ====================================================================
        // Application
        // ====================================================================
        function App() {
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                try {
                    if (localStorage.getItem('esigara_age_verified') === 'true') setIsAgeVerified(true);
                } catch (e) {}
            }, []);

            // Thème clair / sombre (mémorisé dans le navigateur)
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem('esigara_theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
            });
            useEffect(() => {
                document.documentElement.className = theme;
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020617' : '#f1f5f9');
            }, [theme]);
            const toggleTheme = () => {
                const next = theme === 'dark' ? 'light' : 'dark';
                setTheme(next);
                try { localStorage.setItem('esigara_theme', next); } catch (e) {}
            };

            const confirmAge = () => {
                try { localStorage.setItem('esigara_age_verified', 'true'); } catch (e) {}
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home');
            const [gridSize, setGridSize] = useState(() => {
                try { const v = localStorage.getItem('esigara_grid_size'); return GRID_SIZES[v] ? v : 'm'; } catch (e) { return 'm'; }
            });
            const chooseGridSize = (v) => { setGridSize(v); try { localStorage.setItem('esigara_grid_size', v); } catch (e) {} };
            const gs = GRID_SIZES[gridSize];
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [filters, setFilters] = useState(DEFAULT_FILTERS);
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState('');

            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);

            // Modèle de prix DIY préconfiguré par volume et par taux de nicotine
            const [diyPresetPrices, setDiyPresetPrices] = useState(() => {
                try {
                    const saved = localStorage.getItem('esigara_diy_preset_v2');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                
                const def = {};
                ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'].forEach(vol => {
                    ['0mg', '3mg', '6mg'].forEach(nic => {
                        def[`${vol}_${nic}`] = '';
                    });
                });
                return def;
            });

            const hideOutOfStock = settings.hideOutOfStock;
            const isVisible = (p) => !hideOutOfStock || p.variants.some(isInStock);

            // Cache du catalogue dans le navigateur : évite de retélécharger tout le catalogue
            // à chaque visite (c'est ce qui consomme le quota "Egress" de Supabase).
            const CATALOG_CACHE_KEY = 'esigara_catalog_v1';
            const CATALOG_FRESH_MS = 10 * 60 * 1000;      // < 10 min : aucune requête
            const CATALOG_MAX_AGE_MS = 24 * 60 * 60 * 1000; // < 24 h : affiché tout de suite, mis à jour en arrière-plan
            const readCatalogCache = () => {
                try {
                    const raw = localStorage.getItem(CATALOG_CACHE_KEY);
                    if (!raw) return null;
                    const c = JSON.parse(raw);
                    if (!c || !c.t || Date.now() - c.t > CATALOG_MAX_AGE_MS || !Array.isArray(c.b) || !Array.isArray(c.p)) return null;
                    return c;
                } catch (e) { return null; }
            };
            const writeCatalogCache = (data) => {
                try {
                    const str = JSON.stringify({ t: Date.now(), ...data });
                    if (str.length < 4000000) localStorage.setItem(CATALOG_CACHE_KEY, str);
                    else localStorage.removeItem(CATALOG_CACHE_KEY);
                } catch (e) { /* stockage plein ou bloqué : on ignore */ }
            };
            const applyCatalog = ({ b, c, p, v, s: sData }) => {
                setBrands(b);
                setCategories(sortCategories(c));
                setProducts(p.map(prod => ({ ...prod, variants: v.filter(x => x.product_id === prod.id) })));
                if (sData) {
                    setSettings({
                        whatsappNumber: sData.whatsapp_number || DEFAULT_SETTINGS.whatsappNumber,
                        whatsappMessage: sData.whatsapp_message || DEFAULT_SETTINGS.whatsappMessage,
                        messengerUrl: sData.messenger_url || DEFAULT_SETTINGS.messengerUrl,
                        hideOutOfStock: !!sData.hide_out_of_stock,
                        welcomeTitle: sData.welcome_title || DEFAULT_SETTINGS.welcomeTitle,
                        welcomeText: sData.welcome_text || DEFAULT_SETTINGS.welcomeText
                    });
                }
            };

            // opts.useCache = true : utilisé au démarrage. Tous les autres appels (après une modification
            // en administration, bouton « Réessayer ») rechargent toujours les données fraîches.
            const loadDataFromSupabase = async (opts) => {
                const useCache = !!(opts && opts.useCache === true);
                let background = false;
                if (useCache) {
                    const cached = readCatalogCache();
                    if (cached) {
                        applyCatalog(cached);
                        setIsLoading(false);
                        setLoadError('');
                        if (Date.now() - cached.t < CATALOG_FRESH_MS) return;
                        background = true;
                    }
                }
                if (!background) setIsLoading(true);
                setLoadError('');
                try {
                    const [bData, cData, pData, vData, sRes] = await Promise.all([
                        fetchAll('brands'),
                        fetchAll('categories'),
                        fetchAll('products'),
                        fetchAll('variants'),
                        supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle()
                    ]);
                    if (sRes.error) console.warn("Table 'settings' introuvable ou inaccessible :", sRes.error.message);
                    const data = { b: bData, c: cData, p: pData, v: vData, s: sRes.error ? null : sRes.data };
                    applyCatalog(data);
                    writeCatalogCache(data);
                } catch (err) {
                    console.error("Erreur de chargement :", err);

            // Recherche automatique sur internet (fonction Supabase "product-lookup")
            const lookupProductInfo = async () => {
                const name = (newProduct.name || '').trim();
                if (name.length < 2) return alert("Saisissez d'abord le nom du produit.");
                setLookupBusy(true);
                setLookupInfo(null);
                try {
                    const { data: sess } = await supabaseClient.auth.getSession();
                    const token = sess?.session?.access_token;
                    if (!token) return alert("Session expirée : reconnectez-vous à l'administration.");

                    const types = Object.fromEntries(Object.entries(PRODUCT_TYPES).map(([k, t]) => [k, { label: t.label, fields: t.fields.map(f => f.label) }]));
                    const res = await fetch(LOOKUP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY },
                        body: JSON.stringify({
                            name,
                            brand: brands.find(b => b.id === newProduct.brand_id)?.name || '',
                            category: categories.find(c => c.id === newProduct.category_id)?.name || '',
                            types
                        })
                    });
                    let payload = null;
                    try { payload = await res.json(); } catch (e) {}
                    if (res.status === 404) return alert("La recherche automatique n'est pas encore installée sur Supabase (fonction « product-lookup »). Utilisez la recherche manuelle en attendant.");
                    if (!res.ok || !payload?.ok) return alert('Recherche impossible : ' + (payload?.error || ('erreur ' + res.status)));

                    const d = payload.data || {};
                    const items = [];
                    const matchedBrand = d.brand ? brands.find(b => norm(b.name) === norm(d.brand)) : null;
                    if (matchedBrand) items.push({ key: 'brand', label: 'Marque', value: matchedBrand.name, checked: true });
                    if (d.short_description) items.push({ key: 'desc', label: 'Description', value: d.short_description, checked: true });
                    (d.specs || []).forEach(sp => items.push({ key: 'spec', label: sp.label, value: sp.value, checked: true }));
                    if (d.box_content) items.push({ key: 'box', label: 'Contenu de la boîte', value: d.box_content, checked: true });

                    setLookupInfo({ sources: payload.sources || [], confidence: d.confidence || 'low', notes: d.notes || '', brandName: !matchedBrand ? (d.brand || '') : '' });
                    if (items.length === 0) return alert("Aucune information trouvée pour ce nom. Essayez avec le nom complet (marque + modèle).");
                    setSpecImportType(d.type && PRODUCT_TYPES[d.type] ? d.type : '');
                    setSpecImportItems(items);
                } catch (err) {
                    alert('Erreur de connexion : ' + err.message);
                } finally {
                    setLookupBusy(false);
                }
            };

            const openWebSearch = (images) => {

                    chosen.forEach(it => {

                        if (it.key === 'box') { if (!String(box || '').trim()) box = it.value; return; }
                        const idx = specs.findIndex(sp => norm(sp.label) === norm(it.label));
                        if (idx >= 0) { if (!String(specs[idx].value || '').trim()) specs[idx].value = it.value; }
                        else specs.push({ label: it.label, value: it.value });

                    return { ...prev, specs, box_content: box, short_description: desc, brand_id: brandId, product_type: prev.product_type || specImportType || '' };

                setNewBrandDesc('');
                setNewBrandLogo(DEFAULT_LOGO);
                alert('Marque ajoutée !');
                loadDataFromSupabase();
            };

            const deleteBrand = async (id) => {
                const count = products.filter(p => p.brand_id === id).length;
                if (!confirm(count > 0
                    ? `Supprimer cette marque ? ${count} produit(s) seront conservés mais sans marque.`
                    : 'Supprimer cette marque ?')) return;
                const { error: uErr } = await supabaseClient.from('products').update({ brand_id: null }).eq('brand_id', id);
                if (uErr) return alert('Erreur : ' + uErr.message);
                const { error } = await supabaseClient.from('brands').delete().eq('id', id);
                if (error) return alert('Erreur suppression de la marque : ' + error.message);
                loadDataFromSupabase();
            };

            const [editingCatId, setEditingCatId] = useState(null);
            const [newCatName, setNewCatName] = useState('');
            const [newCatParent, setNewCatParent] = useState('');
            const [newCatImage, setNewCatImage] = useState(DEFAULT_CAT_IMG);
            const [newCatOrder, setNewCatOrder] = useState('0');
            const [newCatPriceTable, setNewCatPriceTable] = useState([{ label: '', price: '' }]);

            const getAllChildCategoryIds = (catId, seen = new Set()) => {
                if (seen.has(catId)) return [];
                seen.add(catId);
                let ids = [catId];
                categories.filter(c => c.parent_id === catId).forEach(child => {
                    ids = ids.concat(getAllChildCategoryIds(child.id, seen));
                });
                return ids;
            };

            const resetCategoryForm = () => {
                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent('');
                setNewCatImage(DEFAULT_CAT_IMG);
                setNewCatOrder('0');
                setNewCatPriceTable([{ label: '', price: '' }]);
            };

            const handleLocalCatImageUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = await uploadImageToSupabase(file);
                    if (url) setNewCatImage(url);
                }
            };

            const handleSaveCategory = async (e) => {
                e.preventDefault();
                if (!newCatName) return;

                if (editingCatId && newCatParent && getAllChildCategoryIds(editingCatId).includes(newCatParent)) {
                    return alert('Un dossier ne peut pas être rangé dans lui-même ou dans un de ses sous-dossiers.');
                }

                const filteredPriceTable = newCatPriceTable.filter(row => row.label.trim() !== '' || String(row.price).trim() !== '');

                const catObj = {
                    id: editingCatId || ('c_' + Date.now()),
                    parent_id: newCatParent === '' ? null : newCatParent,
                    name: newCatName,
                    slug: newCatName.toLowerCase().replace(/\s+/g, '-'),
                    image: newCatImage,
                    display_order: parseInt(newCatOrder) || 0,
                    price_table: filteredPriceTable
                };

                const { error } = await supabaseClient.from('categories').upsert([catObj]);
                if (error) return alert('Erreur : ' + error.message);

                resetCategoryForm();
                alert('Rubrique enregistrée !');
                loadDataFromSupabase();
            };

            const startAddSubCategory = (parentCat) => {
                resetCategoryForm();
                setNewCatParent(parentCat.id);
            };

            const startEditCategory = (cat) => {
                setEditingCatId(cat.id);
                setNewCatName(cat.name);
                setNewCatParent(cat.parent_id || '');
                setNewCatImage(cat.image || DEFAULT_CAT_IMG);
                setNewCatOrder(String(cat.display_order ?? 0));
                setNewCatPriceTable(cat.price_table && cat.price_table.length > 0 ? cat.price_table : [{ label: '', price: '' }]);
            };

            const moveCategoryOrder = async (cat, direction) => {
                const siblings = sortCategories(categories.filter(c => (c.parent_id || null) === (cat.parent_id || null)));
                const idx = siblings.findIndex(c => c.id === cat.id);
                const target = idx + direction;
                if (idx < 0 || target < 0 || target >= siblings.length) return;

                const reordered = siblings.slice();
                [reordered[idx], reordered[target]] = [reordered[target], reordered[idx]];

                // Affichage immédiat, puis enregistrement
                const newOrderById = {};
                reordered.forEach((c, i) => { newOrderById[c.id] = i; });
                setCategories(prev => sortCategories(prev.map(c => c.id in newOrderById ? { ...c, display_order: newOrderById[c.id] } : c)));

                const jobs = reordered
                    .filter((c, i) => (c.display_order ?? 0) !== i || c.id === cat.id)
                    .map(c => supabaseClient.from('categories').update({ display_order: newOrderById[c.id] }).eq('id', c.id));
                const results = await Promise.all(jobs);
                const failed = results.find(r => r.error);
                if (failed) alert("Erreur lors de la modification de l'ordre : " + failed.error.message + "\n(La colonne display_order existe-t-elle dans Supabase ?)");
                loadDataFromSupabase();
            };

            const deleteCategory = async (id) => {
                const cat = categories.find(c => c.id === id);
                const newParent = cat?.parent_id || null;
                const childCount = categories.filter(c => c.parent_id === id).length;
                const prodCount = products.filter(p => p.category_id === id).length;
                if (!confirm(`Supprimer cette rubrique ?\n- ${childCount} sous-dossier(s) et ${prodCount} produit(s) seront remontés ${newParent ? 'dans le dossier parent' : 'à la racine / non classés'}.`)) return;

                const { error: e1 } = await supabaseClient.from('categories').update({ parent_id: newParent }).eq('parent_id', id);
                if (e1) return alert('Erreur : ' + e1.message);
                const { error: e2 } = await supabaseClient.from('products').update({ category_id: newParent }).eq('category_id', id);
                if (e2) return alert('Erreur : ' + e2.message);
                const { error } = await supabaseClient.from('categories').delete().eq('id', id);
                if (error) return alert('Erreur suppression de la rubrique : ' + error.message);

                if (editingCatId === id) resetCategoryForm();
                loadDataFromSupabase();
            };

            const [bulkBrandId, setBulkBrandId] = useState('');
            const [bulkCategoryId, setBulkCategoryId] = useState('');
            const [bulkValue, setBulkValue] = useState('');
            const [bulkBusy, setBulkBusy] = useState(false);

            // Configurateur de tableau de prix d'un dossier (affiché en haut de la page du dossier)
            const [ptCatId, setPtCatId] = useState('');
            const [ptRows, setPtRows] = useState([{ label: '', price: '' }]);
            const [ptBusy, setPtBusy] = useState(false);

            const selectPriceTableCategory = (catId) => {
                setPtCatId(catId);
                const cat = categories.find(c => c.id === catId);
                const rows = cat && Array.isArray(cat.price_table) && cat.price_table.length > 0
                    ? cat.price_table.map(r => ({ label: r.label || '', price: r.price ?? '' }))
                    : [{ label: '', price: '' }];
                setPtRows(rows);
            };

            const savePriceTable = async (rows, successMessage) => {
                if (!ptCatId) return alert('Veuillez choisir un dossier.');
                setPtBusy(true);
                try {
                    const { error } = await supabaseClient.from('categories').update({ price_table: rows }).eq('id', ptCatId);
                    if (error) return alert('Erreur : ' + error.message);
                    alert(successMessage);
                    await loadDataFromSupabase();
                    if (rows.length === 0) setPtRows([{ label: '', price: '' }]);
                } finally {
                    setPtBusy(false);
                }
            };

            const handleSavePriceTable = () => {
                const rows = ptRows
                    .map(r => ({ label: r.label.trim(), price: String(r.price).trim() }))
                    .filter(r => r.label !== '' || r.price !== '');
                if (rows.length === 0) return alert('Ajoutez au moins une ligne, ou utilisez « Retirer le tableau ».');
                if (rows.some(r => r.label === '')) return alert('Chaque ligne doit avoir une désignation.');
                savePriceTable(rows, 'Tableau de prix enregistré ! Il s\'affiche en haut de la page du dossier.');
            };

            const handleDeletePriceTable = () => {
                if (!confirm('Retirer le tableau de prix de ce dossier ?')) return;
                savePriceTable([], 'Tableau de prix retiré.');
            };

            // Application du modèle de prix DIY à tous les produits d'un dossier
            const [diyBulkCatId, setDiyBulkCatId] = useState('');
            const [diyBulkVols, setDiyBulkVols] = useState(() => Object.fromEntries(DIY_VOLUMES.map(v => [v, true])));
            const [diyBulkNics, setDiyBulkNics] = useState(() => Object.fromEntries(DIY_NICOTINES.map(n => [n, true])));
            const [diyBulkBusy, setDiyBulkBusy] = useState(false);

            const handleApplyDiyToCategory = async () => {
                if (!diyBulkCatId) return alert('Choisissez le dossier cible (ex : E-liquide DIY).');
                const vols = DIY_VOLUMES.filter(v => diyBulkVols[v]);
                const nics = DIY_NICOTINES.filter(n => diyBulkNics[n]);

                const combos = [];
                vols.forEach(vol => nics.forEach(nic => {
                    const price = parseFloat(diyPresetPrices[`${vol}_${nic}`]);
                    if (!isNaN(price) && price >= 0) combos.push({ vol, nic, price });
                }));
                if (combos.length === 0) return alert("Aucun prix défini pour ces choix. Renseignez d'abord le modèle de prix (onglet 4).");

                const catIds = getAllChildCategoryIds(diyBulkCatId);
                const targets = products.filter(p => catIds.includes(p.category_id));
                if (targets.length === 0) return alert('Aucun produit dans ce dossier.');

                const updates = new Map(); // prix -> identifiants de déclinaisons à mettre à jour
                const creations = [];
                let updateCount = 0;
                targets.forEach(p => combos.forEach(({ vol, nic, price }) => {
                    const matches = p.variants.filter(v => v.volume_ml === vol && v.nicotine_level === nic);
                    if (matches.length > 0) {
                        matches.forEach(v => {
                            if ((Number(v.price) || 0) === price) return;
                            if (!updates.has(price)) updates.set(price, []);
                            updates.get(price).push(v.id);
                            updateCount++;
                        });
                    } else {
                        creations.push({
                            id: `var_${p.id}_diy_${vol}_${nic}`,
                            product_id: p.id,
                            price,
                            stock: 100,
                            nicotine_level: nic,
                            volume_ml: vol,
                            ohm_value: '-',
                            color_finish: '-',
                            flavor: '-',
                            image_url: ''
                        });
                    }
                }));

                if (updateCount === 0 && creations.length === 0) return alert('Tous les produits de ce dossier ont déjà ces prix.');
                if (!confirm(`${targets.length} produit(s) dans ce dossier :\n- ${updateCount} prix mis à jour\n- ${creations.length} déclinaison(s) créée(s)\nLes autres déclinaisons ne sont pas modifiées.\nConfirmer ?`)) return;

                setDiyBulkBusy(true);
                try {
                    const jobs = [];
                    updates.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    for (let i = 0; i < creations.length; i += 200) {
                        jobs.push(supabaseClient.from('variants').upsert(creations.slice(i, i + 200)));
                    }
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s) : ${failed[0].error.message}`);
                    } else {
                        alert(`Modèle DIY appliqué : ${updateCount} prix mis à jour, ${creations.length} déclinaison(s) créée(s).`);
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setDiyBulkBusy(false);
                    loadDataFromSupabase();
                }
            };


            const handleBulkPriceUpdate = async (e) => {
                e.preventDefault();
                const newPrice = parseFloat(bulkValue);
                if (isNaN(newPrice) || newPrice < 0) return alert('Veuillez saisir un prix valide.');
                if (!bulkBrandId && !bulkCategoryId) {
                    return alert('Veuillez sélectionner au moins une marque ou un dossier cible.');
                }

                let targetProducts = products;
                if (bulkBrandId) targetProducts = targetProducts.filter(p => p.brand_id === bulkBrandId);
                if (bulkCategoryId) {
                    const validCatIds = getAllChildCategoryIds(bulkCategoryId);
                    targetProducts = targetProducts.filter(p => validCatIds.includes(p.category_id));
                }
                if (targetProducts.length === 0) return alert('Aucun produit ne correspond à ces critères.');

                const changes = new Map();
                let count = 0;
                targetProducts.forEach(prod => prod.variants.forEach(v => {
                    if ((Number(v.price) || 0) === newPrice) return;
                    if (!changes.has(newPrice)) changes.set(newPrice, []);
                    changes.get(newPrice).push(v.id);
                    count++;
                }));

                if (count === 0) return alert('Tous les produits ciblés ont déjà ce prix.');
                if (!confirm(`Le prix de ${count} déclinaison(s) (${targetProducts.length} produit(s)) sera fixé à ${fmt(newPrice)} Ar.\nConfirmer ?`)) return;

                setBulkBusy(true);
                try {
                    const jobs = [];
                    changes.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s).`);
                    } else {
                        alert(`Changement collectif effectué : ${count} déclinaison(s) mise(s) à jour.`);
                        setBulkValue('');
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setBulkBusy(false);
                    loadDataFromSupabase();
                }
            };

            const activeCategory = categories.find(c => c.id === selectedCategoryId);
            const activeBrand = brands.find(b => b.id === selectedBrandId);
            const selectedProduct = products.find(p => p.id === selectedProductId);

            const queryWords = norm(searchQuery).trim().split(/\s+/).filter(Boolean);
            const searchResults = queryWords.length === 0 ? [] : products.filter(p => {
                if (!isVisible(p)) return false;
                const brand = brands.find(b => b.id === p.brand_id);
                const category = categories.find(c => c.id === p.category_id);
                const searchableText = norm([
                    p.name,
                    p.flavor,
                    p.short_description,
                    p.box_content,
                    PRODUCT_TYPES[p.product_type]?.label || '',
                    getSpecs(p).map(sp => `${sp.label} ${sp.value}`).join(' '),
                    brand ? brand.name : '',
                    category ? category.name : '',
                    ...p.variants.map(v => `${v.flavor} ${v.nicotine_level} ${v.volume_ml} ${v.color_finish} ${v.ohm_value}`)
                ].join(' '));
                return queryWords.every(word => searchableText.includes(word));
            });

            const preferredVariantId = (p) => {
                if (!filters.nic && !filters.vol) return undefined;
                const matches = p.variants.filter(v => variantMatches(v, filters));
                return (matches.find(isInStock) || matches[0])?.id;
            };

            const renderCard = (product) => (
                <ProductCard
                    key={product.id}
                    product={product}
                    brand={brands.find(b => b.id === product.brand_id)}
                    hideOutOfStock={hideOutOfStock}
                    selectedVarId={selectedVariantByProduct[product.id] || preferredVariantId(product)}
                    onSelectVariant={onSelectVariant}
                    qty={quantityByProduct[product.id] || 1}
                    onQty={onQty}
                    onOpen={openProduct}
                    onAdd={addToCart}
                />
            );

            const gridClass = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6";
            const uncategorizedProducts = products.filter(p => !p.category_id || !categories.some(c => c.id === p.category_id));

            const renderAdminProductRow = (p) => (
                <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 bg-white rounded-lg border border-slate-800 flex items-center justify-center p-1">
                            <img src={p.main_image_url} alt={p.name} loading="lazy" className="max-w-full max-h-full object-contain" />
                        </div>
                        <div>
                            <h4 className="font-bold text-xs text-slate-200">{p.name}</h4>
                            <p className="text-[10px] text-slate-400">{p.variants.length} option(s) tarifaire(s)</p>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button onClick={() => startEditProduct(p)} className="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-bold">Modifier</button>
                        <button onClick={() => deleteProduct(p.id)} className="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-bold">Supprimer</button>
                    </div>
                </div>
            );

            const excludedParentIds = editingCatId ? getAllChildCategoryIds(editingCatId) : [];

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {!isAgeVerified && (
                        <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center space-y-6">
                                <div className="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-500 font-black text-2xl">
                                    18+
                                </div>
                                <div className="space-y-2">
                                    <h2 className="text-xl font-black text-slate-100">Avertissement Légal</h2>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        Les produits contenus sur <strong className="text-teal-400">Esigara.mg</strong> sont strictement réservés aux personnes majeures.
                                    </p>
                                    <p className="text-xs text-slate-300 font-semibold pt-2">
                                        Certifiez-vous avoir 18 ans ou plus ?
                                    </p>
                                </div>
                                <div className="space-y-2.5">
                                    <button
                                        onClick={confirmAge}
                                        className="w-full py-3.5 bg-teal-500 hover:bg-teal-400 text-black font-black text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-teal-500/25 transition">
                                        J'ai 18 ans ou plus (Entrer)
                                    </button>
                                    <button
                                        onClick={() => window.location.href = "https://www.google.com"}
                                        className="w-full py-3 bg-slate-950 hover:bg-slate-800 text-slate-400 font-bold text-xs rounded-2xl transition border border-slate-800">
                                        Quitter le site
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="border-b border-slate-800/80 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center gap-3 sm:gap-4">
                            <div className="order-1 flex items-center cursor-pointer shrink-0" onClick={() => navigateTo('home')}>
                                <div className="flex items-center gap-2.5">
                                    <img src={LOGO_SRC} alt="Esigara - Cigarette électronique" className="h-9 sm:h-11 w-auto dark:invert" />
                                    <span className="text-[9px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded-full">18+</span>
                                </div>
                            </div>

                            <form onSubmit={handleSearchSubmit} className="order-3 sm:order-2 relative w-full sm:w-auto sm:flex-1 sm:max-w-md sm:mx-auto">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Rechercher un produit, une saveur, une marque..."
                                    className="w-full bg-slate-950/90 border border-slate-800 rounded-2xl pl-10 pr-24 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 transition shadow-inner"
                                />
                                <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                <button type="submit" className="absolute right-1.5 top-1.5 bg-teal-500 hover:bg-teal-400 text-black px-3 py-1.5 rounded-xl text-[11px] font-bold transition">
                                    Rechercher
                                </button>
                            </form>

                            <div className="order-2 sm:order-3 ml-auto flex items-center gap-2 sm:gap-3">
                                <button
                                    onClick={toggleTheme}
                                    title={theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'}
                                    aria-label={theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'}
                                    className="w-9 h-9 shrink-0 flex items-center justify-center bg-slate-900 border border-slate-800 rounded-xl text-amber-400 hover:border-teal-500 transition">
                                    {theme === 'dark' ? (
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
                                    ) : (
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.35 15.35A8 8 0 118.65 3.65a6.5 6.5 0 0011.7 11.7z"/></svg>
                                    )}
                                </button>
                                {currentView !== 'home' && (
                                    <button onClick={() => navigateTo('home')} aria-label="Retour à l'accueil" className="h-9 px-3 sm:px-4 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800">
                                        &larr;<span className="hidden sm:inline"> Accueil</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => { setCartNotice(null); setShowCartModal(true); }}
                                    aria-label="Panier" className="relative h-9 px-3 sm:px-4 bg-teal-500 hover:bg-teal-400 text-black rounded-2xl font-bold text-xs flex items-center space-x-2 transition shadow-lg shadow-teal-500/20">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                                    <span className="hidden sm:inline">Panier</span>
                                    {cartCount > 0 && (
                                        <span className="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-black shadow">
                                            {cartCount}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        {isLoading ? (
                            <div className="text-center py-20 space-y-3">
                                <div className="w-10 h-10 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                <p className="text-xs text-slate-400">Chargement du catalogue...</p>
                            </div>
                        ) : (
                            <>
                                {loadError && (

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-black text-indigo-400 uppercase tracking-wider">Connexion Administrateur</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-slate-100 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSupabaseLogin} className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Identifiant / Email</label>
                                        <input type="email" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="admin@esigara.mg" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Mot de passe</label>
                                        <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="••••••••" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    {authError && <p className="text-xs text-rose-400">{authError}</p>}
                                    <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
